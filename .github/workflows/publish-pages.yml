name: Publish site and refresh portfolio prices
run-name: Portfolio refresh (${{ github.event_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Offset from the hour to avoid the busiest scheduler times. UTC covers EST and EDT.
    - cron: '3,18,33,48 13-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.window.outputs.refresh }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: window
        run: node scripts/portfolio/schedule.mjs

  build:
    needs: schedule
    if: needs.schedule.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/portfolio/requirements.txt
      - name: Install portfolio history tools
        run: python -m pip install -r scripts/portfolio/requirements.txt
      - name: Refresh cached monthly risk history
        id: risk-history
        continue-on-error: true
        run: python scripts/portfolio/fetch-risk-history.py
      - name: Refresh correlation and cluster analysis
        id: cluster-analysis
        run: python scripts/portfolio/fetch-cluster-analysis.py
      - name: Render PCA figure
        run: python scripts/portfolio/render-cluster-charts.py
      - name: Verify analysis matches the current holdings
        run: node scripts/portfolio-static.mjs check-cluster
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build:preview
      - name: Fetch prices and recalculate portfolio
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/portfolio-static.mjs export market
      - name: Check public files
        run: node scripts/check-pages-preview.mjs
      - name: Save refreshed portfolio analysis caches to repository
        if: steps.risk-history.outcome == 'success' || steps.cluster-analysis.outcome == 'success'
        continue-on-error: true
        run: |
          git add content/portfolio/risk-history.json content/portfolio/cluster-analysis.json public/assets/portfolio/pca-clusters.svg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh portfolio analysis caches'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .local/pages-preview
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
