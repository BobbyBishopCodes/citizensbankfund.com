name: Publish site and refresh portfolio prices
run-name: Portfolio refresh (${{ github.event_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Offset from the hour to avoid the busiest scheduler times. UTC covers EST and EDT.
    - cron: '3,18,33,48 13-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.window.outputs.refresh }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: window
        run: node scripts/portfolio/schedule.mjs

  build:
    needs: schedule
    if: needs.schedule.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
      - name: Test Rust model
        run: npm run model:test
      - name: Refresh Black Litterman history
        run: npm run model:refresh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/portfolio/requirements.txt
      - name: Install portfolio history tools
        run: python -m pip install -r scripts/portfolio/requirements.txt
      - name: Refresh cached monthly risk history
        id: risk-history
        continue-on-error: true
        run: python scripts/portfolio/fetch-risk-history.py
      - name: Refresh correlation and cluster analysis
        id: cluster-analysis
        run: python scripts/portfolio/fetch-cluster-analysis.py
      - name: Render PCA figure
        run: python scripts/portfolio/render-cluster-charts.py
      - name: Verify analysis matches the current holdings
        run: node scripts/portfolio-static.mjs check-cluster
      - name: Check out IRF model
        if: github.event_name != 'schedule'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: BobbyBishopCodes/CPI_PPI_VAR-Impulse_Response_Functions
          ref: 3d24a8ee83503123e88dadedf7243f3caff507a6
          path: .local/irf-model
          persist-credentials: false
      - name: Set up R
        if: github.event_name != 'schedule'
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
      - name: Install macro model packages
        if: github.event_name != 'schedule'
        run: Rscript -e 'install.packages(c("quantmod", "zoo", "vars", "tseries", "jsonlite"))'
      - name: Check forecast calendar
        if: github.event_name != 'schedule'
        run: Rscript --vanilla tests/forecast-cpi-ppi.R
      - name: Test macro model
        if: github.event_name != 'schedule'
        working-directory: .local/irf-model
        run: Rscript --vanilla tests/var_irf_checks.R
      - name: Refresh CPI, PPI and position responses
        if: github.event_name != 'schedule'
        id: macro-refresh
        timeout-minutes: 45
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript --vanilla scripts/refresh-macro.R .local/irf-model/VAR_IRF_CPI_PPI.R content/macro/snapshot.json
      - name: Run tests
        run: npm test
      - name: Build site
        env:
          VITE_TICKER_DATA_URL: ${{ vars.TICKER_DATA_URL }}
        run: npm run build:preview
      - name: Fetch prices and recalculate portfolio
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/portfolio-static.mjs export market
      - name: Check public files
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/check-pages-preview.mjs
      - name: Save refreshed analysis caches to repository
        if: steps.risk-history.outcome == 'success' || steps.cluster-analysis.outcome == 'success' || steps.macro-refresh.outcome == 'success'
        continue-on-error: true
        run: |
          git add content/portfolio/risk-history.json content/portfolio/cluster-analysis.json public/assets/portfolio/pca-clusters.svg content/portfolio/black-litterman-history.json content/macro/snapshot.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh portfolio analysis caches'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .local/pages-preview
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
