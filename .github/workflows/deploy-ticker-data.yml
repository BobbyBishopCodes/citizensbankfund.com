name: Deploy ticker data Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticker-data-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --prefix cloudflare/ticker-data
      - run: node --test tests/ticker-worker.test.mjs
      - name: Verify Worker source and bundle
        working-directory: cloudflare/ticker-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/checked-worker
          node ../../scripts/check-public-secrets.mjs .wrangler/checked-worker
      - name: Deploy Worker and set price-provider secret
        working-directory: cloudflare/ticker-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$FINNHUB_API_KEY"
          npx wrangler deploy
          printf '%s' "$FINNHUB_API_KEY" | npx wrangler secret put FINNHUB_API_KEY
