name: Validate GitHub Pages build (no deployment)

# prep focus, sitll have to really figure out how this works tbh
on:
  workflow_dispatch:
    inputs:
      quote_mode:
        description: 'snapshot needs no secrets; market uses the existing FINNHUB_API_KEY'
        type: choice
        default: snapshot
        options:
          - snapshot
          - market

permissions:
  contents: read

concurrency:
  group: pages-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
      - name: Test Rust model
        run: npm run model:test
      - name: Refresh Black Litterman history
        run: npm run model:refresh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/portfolio/requirements.txt
      - name: Install risk history fetcher
        run: python -m pip install -r scripts/portfolio/requirements.txt
      - name: Refresh cached monthly risk history
        continue-on-error: true
        run: python scripts/portfolio/fetch-risk-history.py

      - name: Check out IRF model
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: BobbyBishopCodes/CPI_PPI_VAR-Impulse_Response_Functions
          ref: 3d24a8ee83503123e88dadedf7243f3caff507a6
          path: .local/irf-model
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - name: Install macro model packages
        run: Rscript -e 'install.packages(c("quantmod", "zoo", "vars", "tseries", "jsonlite"))'

      - name: Test macro model
        working-directory: .local/irf-model
        run: Rscript --vanilla tests/var_irf_checks.R

      - name: Refresh CPI, PPI and position responses
        timeout-minutes: 45
        run: Rscript --vanilla scripts/refresh-macro.R .local/irf-model/VAR_IRF_CPI_PPI.R content/macro/snapshot.json

      - name: Run tests
        run: npm test

      - name: Build static preview with CSV snapshot values
        env:
          VITE_TICKER_DATA_URL: ${{ vars.TICKER_DATA_URL }}
        run: npm run build:preview

      - name: Revalue preview using market quotes
        if: ${{ inputs.quote_mode == 'market' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/portfolio-static.mjs export market

      - name: Verify artifact contents
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/check-pages-preview.mjs

      - name: Save downloadable preview (does not publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-preview-${{ github.run_id }}-${{ inputs.quote_mode }}
          path: .local/pages-preview/
          # Include .nojekyll; the preceding check rejects all other hidden files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
