name: Validate GitHub Pages build (no deployment)

# Preparation only: no push, schedule, Pages configuration, or deployment job.
# At release, enable publishing separately after reviewing the preview artifact.
on:
  workflow_dispatch:
    inputs:
      quote_mode:
        description: 'snapshot needs no secrets; market requires FINNHUB_API_KEY'
        type: choice
        default: snapshot
        options:
          - snapshot
          - market

permissions:
  contents: read

concurrency:
  group: pages-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static preview with CSV snapshot values
        run: npm run build:preview

      - name: Revalue preview using market quotes
        if: ${{ inputs.quote_mode == 'market' }}
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/portfolio-static.mjs export market

      - name: Verify artifact contents
        run: node scripts/check-pages-preview.mjs

      - name: Save downloadable preview (does not publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-preview-${{ github.run_id }}-${{ inputs.quote_mode }}
          path: .local/pages-preview/
          # Include .nojekyll; the preceding check rejects all other hidden files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
